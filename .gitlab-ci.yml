image: node:24.15.0

stages:
  - build
  - deploy
  - security
  - docs

variables:
  NODE_OPTIONS: "--openssl-legacy-provider"

# ===== Automatic Pipelines =====

# 1. Tagged releases (v3.*.*)

build_examples_zip:
  stage: build
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - examples.zip
  script:
    - export NODE_OPTIONS=--openssl-legacy-provider
    - npm install
    - npm run buildExamples
    - apt-get update && apt-get install -y zip
    - cd dist
    - zip -r ../examples.zip .
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(lts|latest)$/'

create_release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build_examples_zip
      artifacts: true
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release"
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(lts|latest)$/'

deploy_examples_zip:
  stage: deploy
  script:
    - export PROJECT_API_PATH=$(node -e "console.log(encodeURIComponent('$CI_PROJECT_PATH'))")
    - apt-get update && apt-get install -y curl
    - echo "Uploading examples.zip to Release Assets (permanent)..."
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        --form "name=examples.zip" \
        --form "url=file://examples.zip" \
        "https://gitlab.opencode.de/api/v4/projects/$PROJECT_API_PATH/releases/$CI_COMMIT_TAG/assets/links"
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(lts|latest)$/'
  needs:
    - job: build_examples_zip
      artifacts: true
    - job: create_release
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  artifacts:
    paths:
      - site
  script:
    - apt-get update && apt-get install -y zip curl wput jq
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - mkdir -p docs/_snippets
    - RELEASE_VERSION="${CI_COMMIT_TAG#v}" && if grep -q "^## .* v${RELEASE_VERSION}.*LTS.*$" CHANGELOG.md 2>/dev/null; then printf '# Welcome to the Masterportal Documentation (%s (lts))\n' "$RELEASE_VERSION" > docs/_snippets/index_title.md; else printf '# Welcome to the Masterportal Documentation (%s)\n' "$CI_COMMIT_TAG" > docs/_snippets/index_title.md; fi
    - mike deploy $CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(lts|latest)$/'

deploy_mkdocs_to_masterportal_org:
  stage: docs
  image: python:3.8
  script:
    - echo "Deploy mkdocs to masterportal.org - configure FTP credentials in CI/CD variables"
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(lts|latest)$/'
  dependencies:
    - create_mkdocs_release

# ===== Manual Pipelines (triggered manually) =====

npm_audit_security:
  stage: security
  cache:
    paths:
      - node_modules/
  script:
    - npm install
    - npm audit --json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

osv_scan_security:
  stage: security
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - osv-result.json
  script:
    - npm install
    - curl -sSL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
    - chmod +x /usr/local/bin/osv-scanner
    - /usr/local/bin/osv-scanner scan -r . --format json > osv-result.json || true
    - node -e "const r=require('./osv-result.json'); console.log('OSV scan finished'); console.log('Results:', r.results?.length || 0);"
    - export JIRA_PROJECT_KEY="BG"
    - export JIRA_BASE_URL="https://lgv-hamburg.atlassian.net"
    - export JIRA_ISSUE_TYPE="Task"
    - export JIRA_USER_EMAIL="geodatenanwendungen@gv.hamburg.de"
    - echo 'JIRA_PROJECT_KEY='$JIRA_PROJECT_KEY
    - echo 'JIRA_BASE_URL='$JIRA_BASE_URL
    - echo 'JIRA_ISSUE_TYPE='$JIRA_ISSUE_TYPE
    - echo 'JIRA_USER_EMAIL='$JIRA_USER_EMAIL
    - node devtools/security/createJiraTicketFromOsv.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

