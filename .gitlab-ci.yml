# ===== Custom Pipelines (triggered manually) =====

npm_audit_security:
  stage: security
  cache:
    paths:
      - node_modules/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "npm_audit"'
  script:
    - npm install
    - npm audit --json

osv_scan_security:
  stage: security
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - osv-result.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "osv_scan"'
  script:
    - npm install
    - curl -sSL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
    - chmod +x /usr/local/bin/osv-scanner
    - /usr/local/bin/osv-scanner scan -r . --format json > osv-result.json || true
    - node -e "const r=require('./osv-result.json'); console.log('OSV scan finished'); console.log('Results:', r.results?.length || 0);"

mkdocs_version:
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "mkdocs_version"'
  script:
    - git config --global user.email "$GIT_USER_EMAIL"
    - git config --global user.name "$GIT_USER_NAME"
    - apt-get update && apt-get install -y zip curl wput jq
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - git fetch --all --tags
    - git checkout "tags/$[[ inputs.deploy_tag ]]"
    - mkdir -p docs/_snippets
    - printf '# Welcome to the Masterportal Documentation (%s)\n' "$[[ inputs.deploy_tag ]]" > docs/_snippets/index_title.md
    - mike deploy "$[[ inputs.deploy_tag ]]"
    - mv "$CI_PROJECT_DIR/site" "$CI_PROJECT_DIR/$[[ inputs.deploy_tag ]]"
    - echo "Upload to FTP - configure MKDOCS_FTP_* in CI/CD variables"

mkdocs_latest:
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "mkdocs_latest"'
  script:
    - git config --global user.email "$GIT_USER_EMAIL"
    - git config --global user.name "$GIT_USER_NAME"
    - apt-get update && apt-get install -y zip curl wput jq
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - git fetch --all --tags
    - git checkout "tags/$[[ inputs.deploy_tag ]]"
    - mkdir -p docs/_snippets
    - printf '# Welcome to the Masterportal Documentation (%s)\n' "$[[ inputs.deploy_tag ]]" > docs/_snippets/index_title.md
    - mike deploy "$[[ inputs.deploy_tag ]]"
    - mv "$CI_PROJECT_DIR/site" "$CI_PROJECT_DIR/Latest"
    - echo "Upload to FTP - configure MKDOCS_FTP_* in CI/CD variables"

validate_mkdocs_manual:
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "validate_mkdocs"'
  script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - devtools/docsValidation/docsValidation.sh

build_examples_manual:
  stage: build
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/**
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "build_examples"'
  script:
    - git fetch --all --tags
    - git checkout "tags/$[[ inputs.deploy_tag ]]"
    - npm install
    - npm run buildExamples
    - apt-get update && apt-get install -y curl