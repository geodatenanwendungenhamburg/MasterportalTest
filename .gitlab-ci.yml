spec:
  inputs:
    pipeline_action:
      description: "Select the custom pipeline to execute"
      type: string
      options:
        - npm_audit
        - osv_scan
        - mkdocs_version
        - mkdocs_latest
        - validate_mkdocs
        - build_examples
      default: npm_audit
    
    deploy_tag:
      description: "Tag to deploy (e.g., v3.1.0) - required for mkdocs_version, mkdocs_latest, build_examples"
      type: string
      default: ""

---
image: node:24.15.0

stages:
  - build
  - deploy
  - security
  - docs

variables:
  NODE_OPTIONS: "--openssl-legacy-provider"

# ===== Automatic Pipelines =====

# 1. Tagged releases (v3.*.*)

build_examples_zip:
  stage: build
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - examples.zip
  script:
    - export NODE_OPTIONS=--openssl-legacy-provider
    - npm install
    - npm run buildExamples
    - apt-get update && apt-get install -y zip
    - cd dist
    - zip -r ../examples.zip .
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(lts|latest)$/'

create_release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build_examples_zip
      artifacts: true
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release"
    assets:
      links:
        - name: examples.zip
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/examples.zip?job=build_examples_zip"
          link_type: other
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(lts|latest)$/'  



create_mkdocs:
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  artifacts:
    paths:
      - site
  script:
    - git config --global user.email "$GIT_USER_EMAIL"
    - git config --global user.name "$GIT_USER_NAME"
    - apt-get update && apt-get install -y zip curl wput jq
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - mkdir -p docs/_snippets
    - |
      RELEASE_VERSION="${CI_COMMIT_TAG#v}"
      if grep -q "^## .* v${RELEASE_VERSION}.*LTS.*$" CHANGELOG.md 2>/dev/null; then
        printf '# Welcome to the Masterportal Documentation (%s (lts))\n' "$RELEASE_VERSION" > docs/_snippets/index_title.md
      else
        printf '# Welcome to the Masterportal Documentation (%s)\n' "$CI_COMMIT_TAG" > docs/_snippets/index_title.md
      fi
    - |
      echo "Release tag found in changelog: v${RELEASE_VERSION}"
    - |
      if grep -q "^## .* v${RELEASE_VERSION}.*LTS.*$" CHANGELOG.md 2>/dev/null; then
        echo "Type: LTS Release"
      else
        echo "Type: Standard Release"
      fi
    - mike deploy $CI_COMMIT_TAG
    - |
      echo "Documentation deployed for release: $CI_COMMIT_TAG"
    - mv $CI_PROJECT_DIR/site $CI_PROJECT_DIR/$CI_COMMIT_TAG
    - echo "deployment"
    - |
      if [ -n "$MKDOCS_FTP_NAME" ] && [ -n "$MKDOCS_FTP_PW" ] && [ -n "$MKDOCS_FTP_SERVER" ]; then
        wput -u $MKDOCS_FTP_NAME -p $MKDOCS_FTP_PW -w ftp://$MKDOCS_FTP_SERVER/$CI_COMMIT_TAG $CI_PROJECT_DIR/$CI_COMMIT_TAG/*
      fi
    - RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - CHANGELOG_RELEASE_HEADER="$(grep -m1 -E "^## .* v${RELEASE_VERSION}( \(LTS\))?$" CHANGELOG.md || true)"
    - |
      echo "Processing tag: $CI_COMMIT_TAG (version: v${RELEASE_VERSION})"
      echo "Changelog header found: $CHANGELOG_RELEASE_HEADER"
    - |
      if [ -z "$CHANGELOG_RELEASE_HEADER" ]; then
        echo "Could not find release headline for $CI_COMMIT_TAG in CHANGELOG.md."
        exit 1
      fi
    - IS_RELEASE_LTS="false"
    - if echo "$CHANGELOG_RELEASE_HEADER" | grep -q ' (LTS)$'; then IS_RELEASE_LTS="true"; fi
    - RELEASE_PATCH="${RELEASE_VERSION##*.}"
    - IS_LTS_HOTFIX="false"
    - if [ "$IS_RELEASE_LTS" = "true" ] && [ "$RELEASE_PATCH" != "0" ]; then IS_LTS_HOTFIX="true"; fi
    - |
      echo "Release type: $IS_RELEASE_LTS (LTS=true, Standard=false)"
      echo "Is LTS hotfix: $IS_LTS_HOTFIX"
    - |
      if [ "$IS_LTS_HOTFIX" = "true" ]; then
        echo "LTS hotfix detected for $CI_COMMIT_TAG - skip Latest docs upload."
        exit 0
      fi
    - mv $CI_PROJECT_DIR/$CI_COMMIT_TAG $CI_PROJECT_DIR/Latest
    - echo "Moved documentation to Latest folder"
    - echo "deployment"
    - |
      if [ -n "$MKDOCS_FTP_NAME" ] && [ -n "$MKDOCS_FTP_PW" ] && [ -n "$MKDOCS_FTP_SERVER" ]; then
        wput -u $MKDOCS_FTP_NAME -p $MKDOCS_FTP_PW -w ftp://$MKDOCS_FTP_SERVER/Latest $CI_PROJECT_DIR/Latest/*
      fi
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(lts|latest)$/'

