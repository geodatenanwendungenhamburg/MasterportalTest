mkdocs_version_to_masterportal_org:
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  script:
    - apt-get update && apt-get install -y zip curl wput jq
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - git fetch --all --tags
    - git checkout tags/$DEPLOY_TAG
    - mkdir -p docs/_snippets
    - printf '# Welcome to the Masterportal Documentation (%s)\n' "$DEPLOY_TAG" > docs/_snippets/index_title.md
    - mike deploy $DEPLOY_TAG
    - mv $CI_PROJECT_DIR/site $CI_PROJECT_DIR/$DEPLOY_TAG
    - echo "Upload to FTP - configure MKDOCS_FTP_* in CI/CD variables"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  variables:
    DEPLOY_TAG: ""

mkdocs_latest_to_masterportal_org:
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  script:
    - apt-get update && apt-get install -y zip curl wput jq
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - git fetch --all --tags
    - git checkout tags/$DEPLOY_TAG
    - mkdir -p docs/_snippets
    - printf '# Welcome to the Masterportal Documentation (%s)\n' "$DEPLOY_TAG" > docs/_snippets/index_title.md
    - mike deploy $DEPLOY_TAG
    - mv $CI_PROJECT_DIR/site $CI_PROJECT_DIR/Latest
    - echo "Upload to FTP - configure MKDOCS_FTP_* in CI/CD variables"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  variables:
    DEPLOY_TAG: ""

validate_mkdocs:
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - devtools/docsValidation/docsValidation.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

upload_docs_to_release_assets:
  stage: docs
  image: python:3.8
  cache:
    paths:
      - .cache/pip/
  script:
    - export PROJECT_API_PATH=$(node -e "console.log(encodeURIComponent('$CI_PROJECT_PATH'))" 2>/dev/null || python3 -c "import urllib.parse; print(urllib.parse.quote('$CI_PROJECT_PATH'))")
    - apt-get update && apt-get install -y zip curl
    - pip install -r devtools/docsValidation/python-dependencies.txt
    - git fetch --all --tags
    - git checkout tags/$DEPLOY_TAG
    - mkdir -p docs/_snippets
    - printf '# Welcome to the Masterportal Documentation (%s)\n' "$DEPLOY_TAG" > docs/_snippets/index_title.md
    - mike deploy $DEPLOY_TAG
    - zip -r masterportal_docs_${DEPLOY_TAG}.zip $CI_PROJECT_DIR/site
    - echo "Uploading documentation to GitLab Release Assets for tag ${DEPLOY_TAG}"
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        --form "name=Documentation ${DEPLOY_TAG}" \
        --form "url=file://masterportal_docs_${DEPLOY_TAG}.zip" \
        "https://gitlab.opencode.de/api/v4/projects/$PROJECT_API_PATH/releases/$DEPLOY_TAG/assets/links"
    - echo "Documentation successfully uploaded to Release Assets"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  variables:
    DEPLOY_TAG: ""
  artifacts:
    paths:
      - masterportal_docs_*.zip
    expire_in: 7 days

build_and_upload_examples_to_release:
  stage: build
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - examples.zip
    expire_in: 7 days
  script:
    - export PROJECT_API_PATH=$(node -e "console.log(encodeURIComponent('$CI_PROJECT_PATH'))" 2>/dev/null || python3 -c "import urllib.parse; print(urllib.parse.quote('$CI_PROJECT_PATH'))")
    - git fetch --all --tags
    - git checkout $DEPLOY_TAG
    - npm install
    - npm run buildExamples
    - apt-get update && apt-get install -y curl zip
    - cd dist && zip -r ../examples.zip .
    - echo "Examples built for tag ${DEPLOY_TAG}"
    - echo "Creating release if it doesn't exist..."
    - |
      RELEASE_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
        --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        "https://gitlab.opencode.de/api/v4/projects/$PROJECT_API_PATH/releases/$DEPLOY_TAG")
      if [ "$RELEASE_EXISTS" != "200" ]; then
        echo "Release $DEPLOY_TAG not found, creating..."
        curl --request POST \
          --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"tag_name\":\"$DEPLOY_TAG\",\"name\":\"Release $DEPLOY_TAG\",\"description\":\"Automated release\"}" \
          "https://gitlab.opencode.de/api/v4/projects/$PROJECT_API_PATH/releases"
      else
        echo "Release $DEPLOY_TAG already exists"
      fi
    - echo "Uploading examples.zip to GitLab Release Assets"
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        --form "name=examples.zip" \
        --form "url=file://examples.zip" \
        "https://gitlab.opencode.de/api/v4/projects/$PROJECT_API_PATH/releases/$DEPLOY_TAG/assets/links"
    - echo "Examples successfully uploaded to Release Assets"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  variables:
    DEPLOY_TAG: ""

